name: Build Executable (.exe)

on:
  workflow_dispatch: # يتيح تشغيل البناء يدوياً بنقرة زر من موقع GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/python-version@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --noconsole --onefile --name="CUSCAR_EDI_Generator" main.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v3
      with:
        name: CUSCAR_EDI_Generator_EXE
        path: dist/CUSCAR_EDI_Generator.exe
